<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
  <title>Otika - Admin Dashboard Template</title>
  <!-- General CSS Files -->
  <link rel="stylesheet" href="assets\css\app.min.css">
  <link rel="stylesheet" href="assets\bundles\bootstrap-social\bootstrap-social.css">
  <!-- Template CSS -->
  <link rel="stylesheet" href="assets\css\style.css">
  <link rel="stylesheet" href="assets\css\components.css">
  <!-- Custom style CSS -->
  <link rel="stylesheet" href="assets\css\custom.css">
  <link rel='shortcut icon' type='image/x-icon' href='assets\img\favicon.ico'>
</head>

<body>
  <div class="loader"></div>
  <div id="app">
    <section class="section">
      <div class="container container-small mt-5">
        <div class="row login-card">
            <div class="col-md-6">
              <div class="my-login">
                <div class="text-center mt-4 mb-3">
                  <img src="assets/img/logo.png" class="mb-3">
                  <div class="text-job text-muted">Welcome Admin!</div>
                  <h4>LOGIN HERE</h4>
                </div>
                  <form method="POST" action="#" class="needs-validation" novalidate="">
                    <div class="form-group">
                      <label for="email">Email</label>
                      <input id="email" type="email" class="form-control" name="email" tabindex="1" required="" autofocus="">
                      <div class="invalid-feedback">
                        Please fill in your email
                      </div>
                    </div>
                    <div class="form-group">
                      <div class="d-block">
                        <label for="password" class="control-label">Password</label>
                        <div class="float-right">
                          <a href="auth-forgot-password.html" class="text-small">
                            Forgot Password?
                          </a>
                        </div>
                      </div>
                      <input id="password" type="password" class="form-control" name="password" tabindex="2" required="">
                      <div class="invalid-feedback">
                        please fill in your password
                      </div>
                    </div>
                    <div class="form-group">
                      <div class="custom-control custom-checkbox">
                        <input type="checkbox" name="remember" class="custom-control-input" tabindex="3" id="remember-me">
                        <label class="custom-control-label" for="remember-me">Remember Me</label>
                      </div>
                    </div>
                    <div class="form-group">
                      <button type="submit" class="btn btn-primary btn-lg btn-block" tabindex="4">
                        Login
                      </button>
                    </div>
                  </form>
                  <div class="text-center mt-4 mb-3">
                    Don't have an account? <a href="auth-register.html">Create One</a>
                  </div>
              </div>
            </div>
            <div class="col-md-6 login-background hide-bg">
              <div class="login-center">
                <h1 class="text-white">Accounting Software</h1>
                <p class="lead text-white pr-5">Easy to navigate, Simple to use!, Here we go It's a elegent software!</p>
                <cite title="text-white Source Title ">&mdash; Admin User</cite>
              </div>
            </div>
          </div>

            <div class="mt-4 text-muted text-center">
              &copy; All right Reserved <a href="">Admin</a>
            </div>
      </div>
    </section>
  </div>
  <!-- General JS Scripts -->
  <script src="assets\js\app.min.js"></script>
  <script src="assets\js\scripts.js"></script>
  <!-- Custom JS File -->
  <script src="assets\js\custom.js"></script>
</body>

</html>
